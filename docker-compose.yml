services:
  zapfit:
    container_name: zapfit-app
    build: .
    volumes:
      - ./data:/app/backend/data:Z
      - ./logs:/app/backend/logs:Z
    ports:
      - "6342:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: docker.io/postgres:18-alpine
    container_name: zapfit-postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U endurain"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./postgres:/var/lib/postgresql/data:Z
    restart: unless-stopped

  redis:
    image: redis:8-alpine
    container_name: zapfit-redis
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./redis:/data:Z
    restart: unless-stopped
